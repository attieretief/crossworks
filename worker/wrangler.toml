name = "crossworks-editor"
main = "src/index.mjs"
compatibility_date = "2026-08-01"

[vars]
REPO = "attieretief/crossworks"
BRANCH = "main"
COMMIT_EMAIL = "info@crossworksmissions.org"
ALLOWED_ORIGINS = "https://crossworksmissions.org,https://www.crossworksmissions.org,https://attieretief.github.io,http://localhost:8080"


# Secrets are never written here. Set them with `npx wrangler secret put <NAME>`:
#   GITHUB_TOKEN    fine-grained PAT, Contents: read & write, this repo only
#   SESSION_SECRET  a long random string (openssl rand -base64 32)
#   EDITORS         [{"name":"Vicki","hash":"…"},{"name":"Reynold","hash":"…"}]
